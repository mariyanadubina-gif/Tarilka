<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarilka — Каталог рецептів</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #B0DB9C;">

  <!-- Навігація -->
  <nav class="navbar navbar-expand-lg custom-navbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">
        <img src="logo.png" alt="Logo" width="33" height="33" class="d-inline-block align-text-top rounded-circle">Tarilka
      </a>
      
      <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto ms-4">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Головна сторінка</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active fw-bold" href="catalog.html">Страви</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" id="communityNavBtn">Спільнота</a>
          </li>
        </ul>

        <div class="d-flex align-items-center gap-2" id="navAuthContainer">
          <button class="btn btn-auth-login" type="button">Вхід</button>
          <button class="btn btn-auth-register" type="button">Реєстрація</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Основний контент каталогу -->
  <div class="container my-4 pb-5">
    
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <h2 class="catalog-title mb-0">Каталог рецептів</h2>
      <button class="btn btn-add-recipe px-4">Додати рецепт</button>
    </div>

    <div class="d-flex gap-2 overflow-auto pb-2 mb-3 categories-scrollbar">
      <button class="btn btn-category active" data-category="all">Усі страви</button>
      <button class="btn btn-category" data-category="breakfast">Ранкові</button>
      <button class="btn btn-category" data-category="lunch">Денні</button>
      <button class="btn btn-category" data-category="dinner">Вечірні</button>
      <button class="btn btn-category" data-category="dessert">Десерти</button>
    </div>

    <div class="card filter-panel border-0 shadow-sm rounded-4 p-3 mb-4 bg-white">
      <div class="row g-2 align-items-center">
        <div class="col-md-5">
          <div class="input-group search-input-group shadow-sm border">
            <span class="input-group-text bg-transparent border-0 text-muted ps-2">
              <i class="bi bi-search"></i>
            </span>
            <input type="search" id="searchInput" class="form-control border-0 shadow-none ps-1" placeholder="Пошук за назвою або автором...">
          </div>
        </div>
        <div class="col-md-3">
          <select id="difficultyFilter" class="form-select border shadow-none">
            <option value="all">Будь-яка складність</option>
            <option value="Легко">Легко</option>
            <option value="Середньо">Середньо</option>
            <option value="Складно">Складно</option>
          </select>
        </div>
        <div class="col-md-2">
          <select id="timeFilter" class="form-select border shadow-none">
            <option value="all">Будь-який час</option>
            <option value="15">До 15 хв</option>
            <option value="30">До 30 хв</option>
            <option value="60">До 60 хв</option>
          </select>
        </div>
        <div class="col-md-2">
          <button id="resetFiltersBtn" class="btn btn-outline-secondary w-100 rounded-3 border">Скинути</button>
        </div>
      </div>
    </div>

    <div class="row g-4" id="catalogGrid"></div>
  </div>

  <!-- Модальні вікна -->
  <div id="authModal" class="modal-overlay">
    <div class="container auth-container">
      <button id="closeModal" class="close-btn">&times;</button>
      <div class="heading" id="modalTitle">Вхід</div>
      
      <form class="form" id="authForm">
        <div id="usernameGroup" style="display: none;">
          <input class="input" type="text" id="username" placeholder="Нікнейм">
        </div>
        <input required class="input" type="email" id="email" placeholder="Електронна пошта">
        <input required class="input" type="password" id="password" placeholder="Пароль">
        <div id="confirmPasswordGroup" style="display: none;">
          <input class="input" type="password" id="confirmPassword" placeholder="Підтвердження пароля">
        </div>
        <span class="forgot-password" id="forgotPasswordSpan"><a href="#" id="forgotPasswordLink">Забули пароль?</a></span>
        <input class="login-button" type="submit" id="submitBtn" value="Увійти">
      </form>
    </div>
  </div>

  <div id="recipeModal" class="modal-overlay">
    <div class="container recipe-modal-container">
      <button id="closeRecipeModal" class="close-btn">&times;</button>
      <div class="heading text-success mb-3" style="color: #2e7d32 !important;">Створити рецепт</div>
      
      <form id="recipeForm" class="form mt-3">
        <div class="mb-2 text-start">
          <label class="form-label small fw-bold text-dark mb-1">Назва рецепта:</label>
          <input required class="input mt-0" type="text" id="recipeTitle" placeholder="Наприклад: Борщ український">
        </div>

        <div class="mb-2 text-start">
          <label class="form-label small fw-bold text-dark mb-1">Категорія:</label>
          <select id="recipeCategory" class="form-select border rounded-3 py-2">
            <option value="breakfast">Ранкові страви</option>
            <option value="lunch" selected>Денні страви</option>
            <option value="dinner">Вечірні страви</option>
            <option value="dessert">Десерти</option>
          </select>
        </div>

        <div class="mb-2 text-start">
          <label class="form-label small fw-bold text-dark mb-1">Короткий опис страви:</label>
          <textarea required class="input mt-0" id="recipeDesc" rows="2" placeholder="Розкажіть трохи про смак або особливості страви..."></textarea>
        </div>

        <div class="mb-2 text-start">
          <label class="form-label small fw-bold text-dark mb-1">Інгредієнти (кожен з нового рядка):</label>
          <textarea required class="input mt-0" id="recipeIngredients" rows="3" placeholder="М'ясо — 500г&#10;Картопля — 4 шт"></textarea>
        </div>

        <div class="mb-2 text-start">
          <label class="form-label small fw-bold text-dark mb-1">Покрокове приготування:</label>
          <textarea required class="input mt-0" id="recipeSteps" rows="4" placeholder="1. Зваріть бульйон...&#10;2. Наріжте овочі..."></textarea>
        </div>

        <div class="row">
          <div class="col-md-6 mb-2 text-start">
            <label class="form-label small fw-bold text-dark mb-1">Час готування:</label>
            <select id="recipeTime" class="form-select border rounded-3 py-2">
              <option value="15 хв" selected>15 хв</option>
              <option value="30 хв">30 хв</option>
              <option value="45 хв">45 хв</option>
              <option value="60 хв">60 хв</option>
              <option value="90+ хв">90+ хв</option>
            </select>
          </div>
          <div class="col-md-6 mb-2 text-start">
            <label class="form-label small fw-bold text-dark mb-1">Складність:</label>
            <select id="recipeDifficulty" class="form-select border rounded-3 py-2">
              <option value="Легко" selected>Легко</option>
              <option value="Середньо">Середньо</option>
              <option value="Складно">Складно</option>
            </select>
          </div>
        </div>

        <div class="mb-2 text-start">
          <label class="form-label small fw-bold text-dark mb-1">Кількість порцій:</label>
          <div class="input-group border rounded-3 bg-white align-items-center" style="height: 38px;">
            <button class="btn btn-outline-secondary border-0 px-3" type="button" id="modalDecreaseServings">-</button>
            <input type="number" id="modalServingsCount" class="form-control text-center border-0 bg-transparent fw-bold text-dark shadow-none p-0" value="1" min="1" max="50">
            <button class="btn btn-outline-secondary border-0 px-3" type="button" id="modalIncreaseServings">+</button>
          </div>
        </div>

        <div class="mb-2 text-start">
          <label class="form-label small fw-bold text-dark mb-1">Фото страви:</label>
          <input required class="form-control rounded-3" type="file" id="recipePhoto" accept="image/*">
        </div>

        <div class="mb-3 text-start">
          <label class="form-label small fw-bold text-dark mb-1">Відеорецепт (необов'язково):</label>
          <input class="form-control rounded-3 mb-2" type="file" id="recipeVideo" accept="video/*">
          <input class="input mt-0" type="url" id="recipeVideoUrl" placeholder="Або вставте посилання на відео">
        </div>

        <input class="login-button mt-3" type="submit" value="Опублікувати рецепт">
      </form>
    </div>
  </div>

  <script src="db.js"></script>
  <script src="logika.js"></script>
  <script src="catalog.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
